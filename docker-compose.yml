services:
  eyecare-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eyecare-ai
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TF_ENABLE_ONEDNN_OPTS=0
      - TF_CPP_MIN_LOG_LEVEL=2
    volumes:
      # Persist SQLite clinical records
      - ./eyecare.db:/app/eyecare.db
      # Persist user uploaded scans and Grad-CAM heatmaps
      - ./uploads:/app/uploads
      # Persist PDF diagnostic reports
      - ./outputs:/app/outputs
    restart: unless-stopped
